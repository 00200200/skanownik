[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "scikit-image>=0.24.0",
    "hydra-core>=1.3.0",
    "torch>=2.9.1",
    "pytorch-lightning>=2.6.0",
    "torchvision>=0.24.1",
    "grad-cam>=1.5.5",
    "matplotlib>=3.10.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
